source_clusters:
  - name: cp_cluster
    bootstrap_brokers:
      - hostname: <CP_BROKER_DNS>
        port: 9092

tables:
  - source_cluster_name: cp_cluster
    source_topic: datagen-orders
    source_format: avro
    schema_mode: inline
    input_schema: |
      {"type":"record","name":"orders","fields":[{"name":"ordertime","type":"long"},{"name":"orderid","type":"int"},{"name":"itemid","type":"string"},{"name":"orderunits","type":"double"},{"name":"address","type":{"type":"record","name":"address","fields":[{"name":"city","type":"string"},{"name":"state","type":"string"},{"name":"zipcode","type":"long"}]}}]}

destination_bucket_url: <BUCKET_URL>
